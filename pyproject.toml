[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-specific-daily-arxiv"
version = "0.3.0"
description = "Domain-aware daily arXiv scout: a research-map screen, an LLM jury, and a selection strategy that evolves from your feedback"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "arxiv",
    "literature-review",
    "research-agent",
    "llm-agent",
    "paper-recommendation",
    "information-filtering",
    "scientific-discovery",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40.0"]
fulltext = ["pypdf>=5.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
arxiv-agent = "arxiv_agent.cli:main"

[project.urls]
Homepage = "https://github.com/mystic-qaq/Daily_Arxiv_in_My_Domain"
Repository = "https://github.com/mystic-qaq/Daily_Arxiv_in_My_Domain"
Issues = "https://github.com/mystic-qaq/Daily_Arxiv_in_My_Domain/issues"
Changelog = "https://github.com/mystic-qaq/Daily_Arxiv_in_My_Domain/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
# Deliberately conservative: correctness, dead code, bugbears and 3.10
# compatibility only, so the CI signal stays meaningful instead of turning into
# a formatting debate.
select = ["E9", "F", "B", "UP"]
