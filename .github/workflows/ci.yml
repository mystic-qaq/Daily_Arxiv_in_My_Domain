name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,fulltext]"

      - name: Lint (syntax, dead code, bugbears, 3.10 compatibility)
        run: python -m ruff check src tests

      - name: Tests (fully offline — no network, no credentials)
        run: python -m pytest

      - name: CLI wiring smoke test
        run: |
          arxiv-agent --help
          arxiv-agent strategy --state-dir "$RUNNER_TEMP/arxiv-state"
          python -m arxiv_agent --help
